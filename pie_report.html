*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#08080d;--s1:#111118;--s2:#191922;--s3:#22222e;--b:#2a2a3a;--t:#e8e8f0;--td:#9090a0;--tm:#606070;--a:#7c6aff;--ad:rgba(124,106,255,.15);--r:#ff4d6a;--o:#ff8c42;--y:#ffd042;--g:#42d68c;--bl:#429dff}
body{font-family:'Inter',-apple-system,system-ui,sans-serif;background:var(--bg);color:var(--t);min-height:100vh}
::selection{background:rgba(124,106,255,.3)}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-thumb{background:var(--b);border-radius:3px}
a{color:var(--a);text-decoration:none}a:hover{text-decoration:underline}

.wrap{max-width:1100px;margin:0 auto;padding:20px}
.header{text-align:center;padding:30px 0 20px;border-bottom:1px solid var(--b);margin-bottom:24px}
.header h1{font-size:28px;font-weight:700;margin-bottom:4px}
.header h1 span{color:var(--a)}
.header .sub{color:var(--td);font-size:13px}
.header .sub b{color:var(--t)}

.stats-row{display:flex;gap:10px;justify-content:center;margin:16px 0;flex-wrap:wrap}
.stat-box{background:var(--s1);border:1px solid var(--b);border-radius:8px;padding:10px 18px;text-align:center;min-width:100px}
.stat-num{font-size:22px;font-weight:700;color:var(--a)}
.stat-label{font-size:9px;color:var(--tm);text-transform:uppercase;letter-spacing:1px;margin-top:2px}

.tabs{display:flex;gap:4px;margin-bottom:16px;border-bottom:1px solid var(--b);padding-bottom:0}
.tab{padding:8px 16px;font-size:12px;font-weight:600;color:var(--tm);cursor:pointer;border-bottom:2px solid transparent;transition:all .15s}
.tab:hover{color:var(--td)}
.tab.active{color:var(--a);border-color:var(--a)}

.panel{display:none}.panel.active{display:block}

/* Projects */
.proj{background:var(--s1);border:1px solid var(--b);border-radius:8px;padding:14px 16px;margin-bottom:8px;cursor:pointer;transition:all .15s}
.proj:hover{border-color:rgba(124,106,255,.3)}
.proj.expanded{border-color:var(--a)}
.proj-top{display:flex;align-items:center;gap:10px}
.proj-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.proj-name{font-size:13px;font-weight:600;flex:1}
.proj-badges{display:flex;gap:4px;flex-shrink:0}
.badge{font-size:8px;padding:2px 6px;border-radius:3px;font-weight:700;letter-spacing:.3px}
.badge-active{background:rgba(66,214,140,.15);color:var(--g)}
.badge-expected{background:rgba(66,157,255,.15);color:var(--bl)}
.badge-dormant{background:rgba(255,208,66,.15);color:var(--y)}
.badge-fading{background:rgba(255,140,66,.15);color:var(--o)}
.badge-dead{background:rgba(96,96,112,.15);color:var(--tm)}
.proj-meta{font-size:10px;color:var(--tm);margin-top:3px;margin-left:18px}
.proj-detail{display:none;margin-top:10px;padding-top:10px;border-top:1px solid var(--b)}
.proj.expanded .proj-detail{display:block}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.detail-col h4{font-size:9px;text-transform:uppercase;letter-spacing:1px;color:var(--a);margin-bottom:6px}
.kv{padding:3px 0;display:flex;gap:6px}
.kv .k{font-size:9px;color:var(--tm);min-width:80px;text-transform:uppercase;letter-spacing:.3px}
.kv .v{font-size:11px;color:var(--t);line-height:1.3;word-break:break-word}
.tl-item{padding:4px 0 4px 12px;border-left:2px solid var(--b);font-size:10px;color:var(--td);line-height:1.3;position:relative;margin-left:4px}
.tl-item::before{content:'';position:absolute;left:-4px;top:8px;width:5px;height:5px;border-radius:50%;background:var(--s3);border:1.5px solid var(--b)}
.tl-item:first-child::before{background:var(--a);border-color:var(--a)}
.related-chip{display:inline-block;font-size:8px;padding:2px 5px;border-radius:3px;background:var(--s2);color:var(--td);margin:1px}

/* Goals */
.goal{background:var(--s1);border:1px solid var(--b);border-radius:6px;padding:8px 12px;margin-bottom:4px;display:flex;align-items:center;gap:8px}
.goal-name{font-size:11px;flex:1;line-height:1.3}
.goal-silence{font-size:9px;color:var(--tm)}

/* Prompt */
.prompt-box{background:var(--s1);border:1px solid var(--b);border-radius:8px;padding:16px;font-family:'SF Mono','Fira Code',monospace;font-size:11px;line-height:1.5;white-space:pre-wrap;color:var(--td);max-height:600px;overflow-y:auto}
.copy-btn{background:var(--a);color:white;border:none;padding:8px 16px;border-radius:6px;font-size:11px;font-weight:600;cursor:pointer;margin-bottom:10px}
.copy-btn:hover{background:#8b7aff}

/* People/Tools */
.entity-row{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid rgba(42,42,58,.5)}
.entity-name{font-size:12px;flex:1}
.entity-count{font-size:10px;color:var(--tm)}

.dot-active{background:var(--g)}.dot-expected{background:var(--bl)}.dot-dormant{background:var(--y)}.dot-fading{background:var(--o)}.dot-dead{background:var(--tm)}.dot-unknown{background:var(--tm)}
</style>

  {id:'projects', label:'Projects ('+R.projects.length+')'},
  {id:'goals', label:'Goals ('+R.goals.length+')'},
  {id:'prompt', label:'System Prompt'},
  {id:'people', label:'People ('+R.people.length+')'},
  {id:'tools', label:'Tools ('+R.tools.length+')'},
];
const tabsEl = document.getElementById('tabs');
const panelsEl = document.getElementById('panels');

tabDefs.forEach((t,i) => {
  tabsEl.innerHTML += '<div class="tab'+(i===0?' active':'')+'" data-tab="'+t.id+'">'+t.label+'</div>';
});

tabsEl.addEventListener('click', e => {
  if (!e.target.classList.contains('tab')) return;
  tabsEl.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  e.target.classList.add('active');
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  document.getElementById('panel-'+e.target.dataset.tab).classList.add('active');
});

// Projects panel

  const dotClass = 'dot-'+(p.status||'unknown');
  const badgeClass = 'badge-'+(p.status||'dead');
  const stateHtml = Object.entries(p.state||{}).map(([k,v]) => {
    let vs = typeof v === 'object' ? JSON.stringify(v) : String(v);
    if (vs.length > 180) vs = vs.slice(0,177)+'...';
    return '<div class="kv"><div class="k">'+k+'</div><div class="v">'+vs+'</div></div>';
  }).join('');
  
  const tlHtml = (p.timeline||[]).map(t => 
    '<div class="tl-item">'+t.ago_days+'d ago — '+t.summary+'</div>'
  ).join('');
  
  const relHtml = (p.related||[]).map(r =>

  ).join('');

  projHtml += '<div class="proj" onclick="this.classList.toggle('expanded')">' +
