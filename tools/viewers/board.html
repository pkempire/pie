<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PIE — Command Center</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #08080d; --surface: #111118; --surface2: #191922; --surface3: #22222e;
    --border: #2a2a3a; --text: #e8e8f0; --text-dim: #9090a0; --text-micro: #606070;
    --accent: #7c6aff; --accent-dim: rgba(124,106,255,0.15);
    --red: #ff4d6a; --orange: #ff8c42; --yellow: #ffd042; --green: #42d68c; --blue: #429dff;
    --radius: 8px;
  }
  body { font-family: 'Inter', -apple-system, system-ui, sans-serif; background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
  ::selection { background: rgba(124,106,255,0.3); }
  ::-webkit-scrollbar { width: 6px; } ::-webkit-scrollbar-track { background: transparent; } ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  /* ── Top bar ── */
  .topbar { display: flex; align-items: center; justify-content: space-between; padding: 10px 20px; border-bottom: 1px solid var(--border); background: var(--surface); flex-shrink: 0; }
  .topbar-left { display: flex; align-items: center; gap: 12px; }
  .logo { width: 28px; height: 28px; background: linear-gradient(135deg, var(--accent), #a78bfa); border-radius: 7px; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; color: white; }
  .topbar h1 { font-size: 15px; font-weight: 600; }
  .topbar h1 span { color: var(--text-dim); font-weight: 400; font-size: 12px; margin-left: 6px; }
  .topbar-center { display: flex; align-items: center; gap: 12px; }
  .goal-amount { font-size: 22px; font-weight: 700; color: var(--green); letter-spacing: -0.5px; }
  .goal-label { font-size: 10px; color: var(--text-micro); text-transform: uppercase; letter-spacing: 1px; }
  .goal-progress { width: 180px; height: 6px; background: var(--surface3); border-radius: 3px; overflow: hidden; }
  .goal-fill { height: 100%; border-radius: 3px; background: linear-gradient(90deg, var(--green), var(--accent)); transition: width 0.6s ease; }
  .topbar-right { display: flex; gap: 8px; align-items: center; }
  .status-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.3; } }
  .status-text { font-size: 11px; color: var(--text-dim); }
  .view-toggle { display: flex; background: var(--surface2); border-radius: 6px; border: 1px solid var(--border); overflow: hidden; }
  .view-btn { padding: 4px 10px; font-size: 10px; color: var(--text-micro); cursor: pointer; border: none; background: none; transition: all 0.15s; }
  .view-btn.active { background: var(--accent-dim); color: var(--accent); }
  .view-btn:hover:not(.active) { color: var(--text-dim); }

  /* ── Main layout ── */
  .main { display: flex; flex: 1; overflow: hidden; }

  /* ── Sidebar ── */
  .sidebar { width: 250px; border-right: 1px solid var(--border); background: var(--surface); display: flex; flex-direction: column; flex-shrink: 0; }
  .sidebar-section { padding: 12px 14px 6px; font-size: 9px; text-transform: uppercase; letter-spacing: 1.2px; color: var(--text-micro); font-weight: 700; }
  .project-list { flex: 1; overflow-y: auto; padding: 2px 6px; }
  .project-item { padding: 8px 10px; border-radius: var(--radius); cursor: pointer; margin-bottom: 1px; transition: all 0.1s; display: flex; align-items: center; gap: 10px; border: 1px solid transparent; }
  .project-item:hover { background: var(--surface2); }
  .project-item.active { background: var(--accent-dim); border-color: rgba(124,106,255,0.25); }
  .project-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .project-info { flex: 1; min-width: 0; }
  .project-name { font-size: 12px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .project-meta { font-size: 9px; color: var(--text-micro); margin-top: 1px; }
  .project-revenue { font-size: 10px; font-weight: 600; color: var(--green); flex-shrink: 0; }
  .dot-active { background: var(--green); } .dot-expected { background: var(--blue); } .dot-dormant { background: var(--yellow); } .dot-fading { background: var(--orange); } .dot-dead { background: var(--text-micro); }

  /* Revenue breakdown */
  .revenue-block { border-top: 1px solid var(--border); padding: 10px 14px; }
  .revenue-row { display: flex; justify-content: space-between; align-items: center; padding: 3px 0; font-size: 11px; }
  .revenue-row .amount { font-weight: 600; color: var(--green); }
  .revenue-total { border-top: 1px solid var(--border); margin-top: 4px; padding-top: 4px; font-weight: 700; }
  .revenue-mini-bar { height: 3px; background: var(--surface3); border-radius: 2px; margin-top: 6px; overflow: hidden; }
  .revenue-mini-fill { height: 100%; background: linear-gradient(90deg, var(--green), var(--accent)); border-radius: 2px; }

  /* ── Content area ── */
  .content { flex: 1; display: flex; flex-direction: column; overflow: hidden; position: relative; }

  /* Project header */
  .project-header { padding: 14px 20px 10px; border-bottom: 1px solid var(--border); background: var(--surface); flex-shrink: 0; }
  .project-header h2 { font-size: 18px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .project-header h2 .status-badge { font-size: 9px; padding: 2px 8px; border-radius: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
  .badge-active { background: rgba(66,214,140,0.15); color: var(--green); }
  .badge-dormant { background: rgba(255,208,66,0.15); color: var(--yellow); }
  .badge-fading { background: rgba(255,140,66,0.15); color: var(--orange); }
  .badge-dead { background: rgba(96,96,112,0.15); color: var(--text-micro); }
  .badge-expected { background: rgba(66,157,255,0.15); color: var(--blue); }
  .header-row { display: flex; gap: 12px; margin-top: 8px; flex-wrap: wrap; }
  .stat-chip { background: var(--surface2); padding: 4px 10px; border-radius: 6px; font-size: 10px; display: flex; gap: 4px; }
  .stat-chip .label { color: var(--text-micro); } .stat-chip .val { font-weight: 600; }

  /* ── 3-column panels ── */
  .panels { flex: 1; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1px; background: var(--border); overflow: hidden; }
  .panel { background: var(--bg); display: flex; flex-direction: column; overflow: hidden; }
  .panel-head { padding: 10px 14px; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.8px; color: var(--text-dim); border-bottom: 1px solid var(--border); background: var(--surface); flex-shrink: 0; display: flex; justify-content: space-between; align-items: center; }
  .panel-body { flex: 1; overflow-y: auto; padding: 10px 12px; }

  /* Sprint tasks */
  .sprint-week { margin-bottom: 14px; }
  .sprint-label { font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: var(--accent); margin-bottom: 6px; padding: 2px 0; border-bottom: 1px solid var(--border); }
  .task { padding: 8px 10px; border-radius: var(--radius); background: var(--surface); border: 1px solid var(--border); margin-bottom: 4px; transition: all 0.1s; }
  .task:hover { border-color: rgba(124,106,255,0.3); }
  .task-row { display: flex; align-items: center; gap: 8px; }
  .task-check { width: 15px; height: 15px; border: 2px solid var(--border); border-radius: 4px; flex-shrink: 0; cursor: pointer; transition: all 0.15s; display: flex; align-items: center; justify-content: center; }
  .task-check:hover { border-color: var(--accent); }
  .task-check.done { background: var(--green); border-color: var(--green); }
  .task-check.done::after { content: '\2713'; font-size: 10px; color: white; }
  .task-text { font-size: 12px; flex: 1; line-height: 1.3; }
  .task-text.done-text { text-decoration: line-through; color: var(--text-micro); }
  .tag { font-size: 8px; padding: 1px 5px; border-radius: 3px; font-weight: 700; letter-spacing: 0.3px; flex-shrink: 0; }
  .tag-ai { background: rgba(124,106,255,0.15); color: var(--accent); }
  .tag-you { background: rgba(255,140,66,0.15); color: var(--orange); }
  .task-sub { font-size: 10px; color: var(--text-micro); margin-top: 3px; margin-left: 23px; line-height: 1.3; }

  /* Agent actions */
  .agent-card { padding: 10px 12px; border-radius: var(--radius); background: var(--surface); border: 1px solid var(--border); margin-bottom: 6px; }
  .agent-card:hover { border-color: rgba(124,106,255,0.3); }
  .agent-icon { font-size: 14px; margin-right: 6px; }
  .agent-title { font-size: 12px; font-weight: 600; margin-bottom: 4px; display: flex; align-items: center; }
  .agent-desc { font-size: 10px; color: var(--text-dim); line-height: 1.4; margin-bottom: 6px; }
  .agent-btn { padding: 5px 12px; border-radius: 6px; font-size: 10px; font-weight: 600; cursor: pointer; border: none; transition: all 0.15s; }
  .agent-btn-primary { background: var(--accent); color: white; }
  .agent-btn-primary:hover { background: #8b7aff; }
  .agent-btn-secondary { background: var(--surface2); color: var(--text-dim); border: 1px solid var(--border); }
  .agent-btn-secondary:hover { color: var(--text); border-color: var(--accent-dim); }
  .agent-context { font-size: 9px; color: var(--text-micro); margin-top: 4px; font-style: italic; }

  /* Context panel */
  .ctx-group { margin-bottom: 14px; }
  .ctx-group-title { font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: var(--accent); margin-bottom: 6px; padding-bottom: 4px; border-bottom: 1px solid var(--border); }
  .ctx-row { padding: 4px 0; display: flex; gap: 6px; }
  .ctx-key { font-size: 9px; color: var(--text-micro); min-width: 80px; flex-shrink: 0; text-transform: uppercase; letter-spacing: 0.3px; padding-top: 1px; }
  .ctx-val { font-size: 11px; color: var(--text); line-height: 1.4; word-break: break-word; }
  .timeline-entry { padding: 6px 0 6px 14px; border-left: 2px solid var(--border); margin-left: 4px; position: relative; font-size: 11px; color: var(--text-dim); line-height: 1.3; }
  .timeline-entry::before { content: ''; position: absolute; left: -4px; top: 10px; width: 6px; height: 6px; border-radius: 50%; background: var(--surface3); border: 1.5px solid var(--border); }
  .timeline-entry:first-child::before { background: var(--accent); border-color: var(--accent); }
  .related-chip { display: inline-block; font-size: 9px; padding: 2px 6px; border-radius: 4px; background: var(--surface2); color: var(--text-dim); margin: 1px 2px; }

  /* ── Command bar ── */
  .command-bar { border-top: 1px solid var(--border); background: var(--surface); padding: 8px 16px; display: flex; gap: 8px; align-items: center; flex-shrink: 0; }
  .cmd-input { flex: 1; background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius); padding: 8px 12px; color: var(--text); font-size: 12px; font-family: inherit; outline: none; transition: border-color 0.15s; }
  .cmd-input:focus { border-color: var(--accent); }
  .cmd-input::placeholder { color: var(--text-micro); }
  .cmd-send { padding: 8px 16px; background: var(--accent); color: white; border: none; border-radius: var(--radius); font-size: 11px; font-weight: 600; cursor: pointer; transition: background 0.15s; }
  .cmd-send:hover { background: #8b7aff; }
  .cmd-context-tag { font-size: 9px; background: var(--accent-dim); color: var(--accent); padding: 2px 8px; border-radius: 4px; flex-shrink: 0; }

  /* Empty */
  .empty-state { display: flex; align-items: center; justify-content: center; height: 100%; flex-direction: column; gap: 8px; color: var(--text-micro); font-size: 13px; }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-left">
    <div class="logo">P</div>
    <h1>PIE<span>Command Center</span></h1>
  </div>
  <div class="topbar-center">
    <div>
      <div class="goal-label">Revenue Target</div>
      <div class="goal-amount" id="goalAmount">$0 / $100K</div>
    </div>
    <div class="goal-progress"><div class="goal-fill" id="goalFill" style="width:0%"></div></div>
  </div>
  <div class="topbar-right">
    <div class="view-toggle">
      <button class="view-btn active" onclick="setView('sprint')">Sprint</button>
      <button class="view-btn" onclick="setView('context')">Context</button>
    </div>
    <div class="status-dot"></div>
    <span class="status-text">agents ready</span>
  </div>
</div>

<div class="main">
  <div class="sidebar">
    <div class="sidebar-section">Revenue Projects</div>
    <div class="project-list" id="projectList"></div>
    <div class="revenue-block">
      <div class="sidebar-section" style="padding:0 0 4px 0;">Path to $100K</div>
      <div id="revenueBreakdown"></div>
      <div class="revenue-mini-bar"><div class="revenue-mini-fill" id="revFill" style="width:0%"></div></div>
    </div>
  </div>

  <div class="content" id="content">
    <div class="empty-state">Select a project</div>
  </div>
</div>

<div class="command-bar">
  <div class="cmd-context-tag" id="cmdContext">no project</div>
  <input class="cmd-input" id="cmdInput" placeholder="Ask the agent anything about this project..." onkeydown="if(event.key==='Enter')sendCommand()">
  <button class="cmd-send" onclick="sendCommand()">Send</button>
</div>

    const rev = revTargets[key] || '';
    return '<div class="project-item" data-key="' + key + '" onclick="selectProject(\'' + key + '\')">' +
      '<div class="project-dot ' + dot + '"></div>' +
      '<div class="project-info"><div class="project-name">' + name + '</div><div class="project-meta">' + meta + '</div></div>' +
      (rev ? '<div class="project-revenue">' + rev + '</div>' : '') +
      '</div>';
  }).join('');

  // Revenue breakdown
  const rb = document.getElementById('revenueBreakdown');
  let totalTarget = 0, totalCurrent = 0;
  rb.innerHTML = Object.entries(REVENUE_TARGETS).map(([k, r]) => {
    totalTarget += r.target;
    totalCurrent += r.current;
    return '<div class="revenue-row"><span>' + r.label + '</span><span class="amount">$' + (r.current/1000).toFixed(0) + 'K / $' + (r.target/1000).toFixed(0) + 'K</span></div>';
  }).join('') + '<div class="revenue-row revenue-total"><span>Total</span><span class="amount">$' + (totalCurrent/1000).toFixed(0) + 'K / $' + (totalTarget/1000).toFixed(0) + 'K</span></div>';

  document.getElementById('revFill').style.width = (totalCurrent / totalTarget * 100) + '%';
  document.getElementById('goalAmount').textContent = '$' + (totalCurrent/1000).toFixed(0) + 'K / $100K';
  document.getElementById('goalFill').style.width = (totalCurrent / 100000 * 100) + '%';
}

function setView(v) {
  currentView = v;
  document.querySelectorAll('.view-btn').forEach(b => b.classList.toggle('active', b.textContent.toLowerCase() === v));
  if (currentProject) selectProject(currentProject);
}

function selectProject(key) {
  currentProject = key;
  document.querySelectorAll('.project-item').forEach(el => el.classList.toggle('active', el.dataset.key === key));
  document.getElementById('cmdContext').textContent = PROJECTS[key].entity.name;

  const proj = PROJECTS[key];
  const t = proj.temporal || {};
  const state = proj.entity.state || {};
  const sprints = SPRINTS[key] || [];
  const actions = AGENT_ACTIONS[key] || [];
  const content = document.getElementById('content');

  const badgeClass = 'badge-' + (t.status || 'dead');
  const revTarget = REVENUE_TARGETS[key];

  content.innerHTML =
    '<div class="project-header">' +
      '<h2>' + proj.entity.name + ' <span class="status-badge ' + badgeClass + '">' + (t.status || '?') + '</span></h2>' +
      '<div class="header-row">' +
        (revTarget ? '<div class="stat-chip"><span class="label">Target</span><span class="val">' + '$' + (revTarget.target/1000) + 'K</span></div>' : '') +
        '<div class="stat-chip"><span class="label">Rhythm</span><span class="val">' + (t.rhythm_days || '?') + 'd</span></div>' +
        '<div class="stat-chip"><span class="label">Silence</span><span class="val">' + (t.silence_days || '?') + 'd</span></div>' +
        '<div class="stat-chip"><span class="label">Updates</span><span class="val">' + (t.transitions || '?') + '</span></div>' +
        (state.subscribers ? '<div class="stat-chip"><span class="label">Subs</span><span class="val">' + state.subscribers + '</span></div>' : '') +
        (state.students ? '<div class="stat-chip"><span class="label">Students</span><span class="val">' + state.students + '</span></div>' : '') +
        (state.brands ? '<div class="stat-chip"><span class="label">Brands</span><span class="val">' + state.brands + '</span></div>' : '') +
        (state.creators ? '<div class="stat-chip"><span class="label">Creators</span><span class="val">' + state.creators + '</span></div>' : '') +
      '</div>' +
    '</div>' +
    '<div class="panels">' +
      renderSprintPanel(key, sprints) +
      renderAgentPanel(actions) +
      renderContextPanel(proj, state) +
    '</div>';
}

function renderSprintPanel(projKey, sprints) {
  let html = '<div class="panel"><div class="panel-head"><span>\uD83C\uDFAF Sprint Plan</span><span style="font-size:9px;color:var(--text-micro)">' + sprints.reduce((a,s)=>a+s.tasks.length,0) + ' tasks</span></div><div class="panel-body">';

  sprints.forEach((sprint, si) => {
    html += '<div class="sprint-week"><div class="sprint-label">' + sprint.week + '</div>';
    sprint.tasks.forEach((task, ti) => {
      const tk = taskKey(projKey, si, ti);
      const done = completedTasks[tk];
      html += '<div class="task">' +
        '<div class="task-row">' +
          '<div class="task-check' + (done ? ' done' : '') + '" onclick="toggleTask(\'' + tk + '\',this)"></div>' +
          '<div class="task-text' + (done ? ' done-text' : '') + '">' + task.text + '</div>' +
          '<div class="tag tag-' + task.tag + '">' + (task.tag === 'ai' ? 'AI' : 'YOU') + '</div>' +
        '</div>' +
        (task.sub ? '<div class="task-sub">' + task.sub + '</div>' : '') +
      '</div>';
    });
    html += '</div>';
  });

  html += '</div></div>';
  return html;
}

function renderAgentPanel(actions) {
  let html = '<div class="panel"><div class="panel-head"><span>\uD83E\uDD16 Agent Actions</span><span style="font-size:9px;color:var(--text-micro)">' + actions.length + ' available</span></div><div class="panel-body">';

  actions.forEach(a => {
    html += '<div class="agent-card">' +
      '<div class="agent-title">' + a.icon + ' ' + a.title + '</div>' +
      '<div class="agent-desc">' + a.desc + '</div>' +
      '<div style="display:flex;gap:6px;">' +
        '<button class="agent-btn ' + (a.primary ? 'agent-btn-primary' : 'agent-btn-secondary') + '" onclick="runAgent(\'' + a.title.replace(/'/g,"\\'") + '\')">' + (a.primary ? '\u25B6 Run Now' : 'Run') + '</button>' +
        '<button class="agent-btn agent-btn-secondary" onclick="showContext(this)">Show Context</button>' +
      '</div>' +
      '<div class="agent-context" style="display:none">' + (a.context || '') + '</div>' +
    '</div>';
  });

  html += '</div></div>';
  return html;
}

function renderContextPanel(proj, state) {
  const keyFields = ['phase','status','stage','next_steps','current_goals','pricing_targets','short_term_target',
    'one_year_target','revenue','subscribers','students','scale','traction','business_model','monetization_paths',
    'ICP_target','current_focus','positioning','current_capabilities','metrics','investment','capacity'];

  let html = '<div class="panel"><div class="panel-head"><span>\uD83D\uDDC2 Full Context</span><span style="font-size:9px;color:var(--text-micro)">' + Object.keys(state).length + ' fields</span></div><div class="panel-body">';

  // Key state
  html += '<div class="ctx-group"><div class="ctx-group-title">Key State</div>';
  keyFields.forEach(k => {
    if (state[k] !== undefined && state[k] !== null) {
      let v = state[k];
      if (Array.isArray(v)) v = v.join(', ');
      else if (typeof v === 'object') v = JSON.stringify(v);
      if (String(v).length > 200) v = String(v).slice(0,200) + '\u2026';
      html += '<div class="ctx-row"><div class="ctx-key">' + k + '</div><div class="ctx-val">' + v + '</div></div>';
    }
  });
  html += '</div>';

  // Timeline
  if (proj.timeline && proj.timeline.length) {
    html += '<div class="ctx-group"><div class="ctx-group-title">Recent Activity</div>';
    proj.timeline.forEach(t => {
      html += '<div class="timeline-entry">' + (t.summary || '') + '</div>';
    });
    html += '</div>';
  }

  // Related
  if (proj.related && proj.related.length) {
    html += '<div class="ctx-group"><div class="ctx-group-title">Connected (' + proj.related.length + ')</div><div>';
    proj.related.forEach(r => {
      html += '<span class="related-chip">' + r.name + '</span>';
    });
    html += '</div></div>';
  }

  html += '</div></div>';
  return html;
}

// ═══════════════════════════════════════════════════════
// INTERACTIONS
// ═══════════════════════════════════════════════════════

function toggleTask(tk, el) {
  if (completedTasks[tk]) { delete completedTasks[tk]; }
  else { completedTasks[tk] = true; }
  saveTasks();
  el.classList.toggle('done');
  const textEl = el.nextElementSibling;
  if (textEl) textEl.classList.toggle('done-text');
}

function runAgent(title) {
  const proj = PROJECTS[currentProject];
  const msg = 'Running "' + title + '" with full context for ' + proj.entity.name + '...';
  const bar = document.getElementById('cmdInput');
  bar.value = '';
  bar.placeholder = msg;
  setTimeout(() => { bar.placeholder = 'Ask the agent anything about this project...'; }, 3000);
}

function showContext(btn) {
  const ctx = btn.parentElement.nextElementSibling;
  ctx.style.display = ctx.style.display === 'none' ? 'block' : 'none';
}

function sendCommand() {
  const input = document.getElementById('cmdInput');
  const cmd = input.value.trim();
  if (!cmd) return;
  input.value = '';
  const proj = currentProject ? PROJECTS[currentProject].entity.name : 'none';
  console.log('[PIE Command]', { project: proj, command: cmd, context_injected: true });
  input.placeholder = 'Processing: "' + cmd.slice(0,60) + '"...';
  setTimeout(() => { input.placeholder = 'Ask the agent anything about this project...'; }, 3000);
}

// ═══════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════
renderSidebar();
const firstKey = Object.keys(PROJECTS)[0];
if (firstKey) selectProject(firstKey);
</script>
</body>
</html>
